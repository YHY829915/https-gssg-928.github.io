        :root {

            --accent-color: #8b572a; /* 古典金棕色 */
            --border-color: #e0e0e0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        /* 头部样式 */
        header {
            text-align: center;
            padding: 40px 0 30px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 4px;
            color: var(--accent-color);
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-sub);
            letter-spacing: 1px;
        }

        /* 题目与选项样式 */
        .question-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            margin-bottom: 20px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .q-title {
            font-size: 16px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .q-num {
            color: var(--accent-color);
            margin-right: 5px;
        }

        .options { display: flex; flex-direction: column; gap: 12px; }

        .option-btn {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 8px;
            text-align: left;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-main);
        }

        .option-btn:hover { border-color: var(--accent-color); background: #fff; }
        .option-btn:active { transform: scale(0.98); }

        /* 进度条 */
        .progress-container {
            height: 4px;
            background: var(--border-color);
            border-radius: 2px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: var(--accent-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* 结果页样式 */
        .result-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
            animation: fadeIn 0.8s ease;
        }

        .result-title { font-size: 24px; color: var(--accent-color); margin-bottom: 5px; }
        .result-subtitle { font-size: 18px; margin-bottom: 20px; color: var(--text-main); }
        .divider { height: 1px; background: var(--border-color); margin: 20px 0; }
        .analysis-title { font-size: 16px; font-weight: 600; margin-bottom: 10px; text-align: left; color: var(--accent-color); }
        .analysis-text { font-size: 14px; color: var(--text-sub); text-align: left; line-height: 1.8; margin-bottom: 20px; }

        .restart-btn {
            margin-top: 20px;
            padding: 12px 30px;
            background: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 25px;
            font-size: 15px;
            cursor: pointer;
        }

        /* 隐藏类 */
        .hidden { display: none !important; }

    </style>
</head>
